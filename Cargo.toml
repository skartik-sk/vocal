[package]
name = "vocal"
version = "0.1.0"
edition = "2024"
# This section tells cargo-bundle how to build Vocal.app
[package.metadata.bundle]
name = "Vocal"
identifier = "com.kartik.vocal"
icon = ["src-tauri/icons/icon.icns"]
category = "public.app-category.utilities"
short_description = "A lightning-fast local TTS reader."
osx_info_plist_exts = ["Info.plist.ext"]

[dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSString"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSPasteboard"] }
# MCP server (vocal-mcp binary): exposes Vocal TTS as an agent-callable tool.
rmcp = { version = "0.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
